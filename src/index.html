<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @@HEAD@@ -->
  <title>PDF-A-go-go: a simple, embeddable PDF viewer project</title>
</head>
<body>
  <header>
    <h1><a href="./index.html">PDF-A-go-go</a></h1>
    <!-- @@NAV@@ -->
  </header>
  <main>
    <p>A lightweight embeddable PDF viewer. <a href="https://github.com/khawkins98/PDF-A-go-go" target="_blank" rel="noopener noreferrer">See the docs on GitHub</a>.
    </p>
    <script defer="defer" src="pdf-a-go-go.js"></script>
    <div class="pdfagogo-container" id="pdfagogo-container"
         tabindex="0"
         role="region"
         aria-label="PDF Viewer"
         aria-live="polite"
         aria-atomic="true"
         data-pdf-url="./example.pdf"
         data-show-search="true"
         data-show-prev-next="true"
         data-show-page-selector="true"
         data-show-current-page="true"
         data-default-page="3"
         data-show-download="true"
         data-show-share="true"
         data-show-accessibility-controls-visibly="false"
         disabled-data-momentum="2"
         data-debug="false"
        >
      </div>
  </main>
</body>
</html>
