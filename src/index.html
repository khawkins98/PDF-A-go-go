<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-A-go-go: Accessible PDF viewer with search</title>
  <link rel="stylesheet" href="pdf-a-go-go.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <style>
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif;
    }
  </style>
</head>
<body>
  <div style="margin:1rem auto;text-align:center;">
    <h1>PDF-A-go-go</h1> A lightweight embeddable PDF viewer. View the project or contribute on
    <a href="https://github.com/khawkins98/PDF-A-go-go" target="_blank" rel="noopener noreferrer">GitHub</a>.
  </div>

  <div style="max-width:1200px;margin:1rem auto;text-align:center;background:#f9f9f9;padding:1rem;border-radius:6px;">
    <h3 style="margin-top:0;">Demo Pages</h3>
    <div style="display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;">
      <a href="./" style="padding:0.5rem 1rem;background:#004f91;color:white;text-decoration:none;border-radius:4px;font-weight:bold;">Basic Demo</a>
      <a href="./double-spread.html" style="padding:0.5rem 1rem;background:#0066cc;color:white;text-decoration:none;border-radius:4px;">Large Double Spread (12MB PDF)</a>
      <a href="./html-download-example.html" style="padding:0.5rem 1rem;background:#0066cc;color:white;text-decoration:none;border-radius:4px;">HTML Download Handler</a>
      <a href="./stress-test-large-pdf.html" style="padding:0.5rem 1rem;background:#0066cc;color:white;text-decoration:none;border-radius:4px;">Stress Test (827 pages)</a>
    </div>
  </div>

  <!--
    UI controls (search, prev/next, page selector, etc) can be enabled/disabled via data attributes.
    See README.md for details.
  -->
  <script defer="defer" src="pdf-a-go-go.js"></script>
  <div class="pdfagogo-container" id="pdfagogo-container"
       tabindex="0"
       role="region"
       aria-label="PDF Viewer"
       aria-live="polite"
       aria-atomic="true"
       data-pdf-url="./example.pdf"
       data-show-search="true"
       data-show-prev-next="true"
       data-show-page-selector="true"
       data-show-current-page="true"
       data-show-download="true"
       disabled-data-momentum="2"
       data-debug="true"
      >
    </div>
</body>
</html>
