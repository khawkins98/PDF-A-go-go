<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @@HEAD@@ -->
  <title>i18n Test - PDF-A-go-go</title>
</head>
<body>
  <header>
    <!-- @@NAV@@ -->
  </header>
  <main>
    <h1>i18n Test</h1>
    <script defer="defer" src="../pdf-a-go-go.js"></script>
    <!-- A few strings are overridden via data-strings (French); the rest fall
         back to the English defaults. example.pdf has an outline, so the
         outline label override can be checked too. -->
    <div class="pdfagogo-container" id="pdfagogo-container"
         data-pdf-url="../example.pdf"
         data-show-search="true"
         data-show-outline="true"
         data-strings='{"nextPage":"Page suivante","prevPage":"Page précédente","searchPlaceholder":"Rechercher…","noMatches":"Aucun résultat","outline":"Table des matières","download":"Télécharger le PDF"}'>
    </div>

    <h2>Invalid data-strings (should degrade to English)</h2>
    <!-- Malformed JSON: initialization must not break, and every label falls
         back to the English defaults. -->
    <div class="pdfagogo-container" id="pdfagogo-invalid"
         data-pdf-url="../pdf-a-go-go-showcase.pdf"
         data-show-search="true"
         data-strings='{ not valid json, }'>
    </div>
  </main>
</body>
</html>
