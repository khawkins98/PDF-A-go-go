<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @@HEAD@@ -->
  <title>HTML Proxy - PDF-A-go-go</title>
</head>
<body>
  <header>
    <!-- @@NAV@@ -->
  </header>
  <main>
    <h1>HTML Proxy</h1>
    <p>Handles URLs that return an HTML page before delivering the PDF. Common with institutional repositories that show a download page first.</p>
    <div class="feature-list">
      <span class="badge">HTML Detection</span>
      <span class="badge">Auto Redirect</span>
      <span class="badge">Institutional Support</span>
    </div>
    <script defer="defer" src="pdf-a-go-go.js"></script>
    <div id="pdfagogo-container"
         class="pdfagogo-container"
         tabindex="0"
         role="region"
         aria-label="PDF Viewer"
         aria-live="polite"
         aria-atomic="true"
         data-pdf-url="html-download-example-iframe.html"
         data-show-search="true"
         data-show-prev-next="true"
         data-show-page-selector="true"
         data-show-current-page="true"
         data-show-download="true"
         data-debug="true"
         data-download-timeout="60000">
    </div>
  </main>
</body>
</html>
