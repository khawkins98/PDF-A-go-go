<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @@HEAD@@ -->
  <title>Large PDF (12MB) - PDF-A-go-go</title>
</head>
<body>
  <header>
    <!-- @@NAV@@ -->
  </header>
  <main>
    <h1>Large PDF (12MB)</h1>
    <p>A 12MB PDF with wide double-page spreads. Tests high-resolution rendering and memory management with large file sizes.</p>
    <div class="feature-list">
      <span class="badge">12MB File</span>
      <span class="badge">Double Spread</span>
      <span class="badge">High Resolution</span>
    </div>
    <script defer="defer" src="pdf-a-go-go.js"></script>
    <div class="pdfagogo-container" id="pdfagogo-container"
        tabindex="0"
        role="region"
        aria-label="PDF Viewer"
        aria-live="polite"
        aria-atomic="true"
        data-pdf-url="./example_spread.pdf"
        data-default-page="3"
        data-show-resize-grip="false"
        data-show-prev-next="false"
        data-show-search="true"
        data-show-fullscreen="true"
        data-show-download="true"
        data-debug="true">
    </div>
  </main>
</body>
</html>
