<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-A-go-go: Accessible PDF viewer with search</title>
  <link rel="stylesheet" href="pdf-a-go-go.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <style>
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif;
    }
  </style>
</head>
<body>
  <div style="max-width:1200px;margin:1rem auto;">
    <h1><a href="./">PDF-A-go-go</a></h1>
    <div>A lightweight embeddable PDF viewer. View the project or contribute on
      <a href="https://github.com/khawkins98/PDF-A-go-go" target="_blank" rel="noopener noreferrer">GitHub</a>.
    </div>
    <p>
      This is an example of a large double spread PDF.
    </p>
  </div>
  <hr>
  <!--
    UI controls (search, prev/next, page selector, etc) can be enabled/disabled via data attributes.
    See README.md for details.
  -->
  <script defer="defer" src="pdf-a-go-go.js"></script>
  <div class="pdfagogo-container" id="pdfagogo-container"
      tabindex="0"
      role="region"
      aria-label="PDF Viewer"
      aria-live="polite"
      aria-atomic="true"
      data-pdf-url="./example_spread.pdf"
      data-default-page="3"
      data-show-resize-grip="false"
      data-show-prev-next="false"
      data-show-search="true"
      disabled-data-momentum="2"
      data-debug="true"
    >
  </div>
</body>
</html>
