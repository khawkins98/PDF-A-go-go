<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-A-go-go: Accessible PDF viewer with search</title>
  <link rel="stylesheet" href="pdf-a-go-go.css">

  <!-- Simple.css is only used for the demo pages, not a required dependency -->
  <link rel="stylesheet" href="https://cdn.simplecss.org/simple.css">
</head>
<body>
  <header>
    <h1>PDF-A-go-go</h1>
    <nav>
      <a href="./">Basic Demo</a>
      <a href="./double-spread.html">Large Double Spread (12MB PDF)</a>
      <a href="./html-download-example.html">HTML Download Handler</a>
      <a href="./stress-test-large-pdf.html">Stress Test (827 pages)</a>
      <a href="./remote-pdf-allowed.html">Remote PDF (CORS allowed)</a>
      <a href="./remote-pdf-cors-fail.html">Remote PDF (expected CORS failure)</a>
    </nav>
    <p>
      This is an example of a large double spread PDF.
    </p>
  </header>
  <!--
    UI controls (search, prev/next, page selector, etc) can be enabled/disabled via data attributes.
    See README.md for details.
  -->
  <script defer="defer" src="pdf-a-go-go.js"></script>
  <div class="pdfagogo-container" id="pdfagogo-container"
      tabindex="0"
      role="region"
      aria-label="PDF Viewer"
      aria-live="polite"
      aria-atomic="true"
      data-pdf-url="./example_spread.pdf"
      data-default-page="3"
      data-show-resize-grip="false"
      data-show-prev-next="false"
      data-show-search="true"
      disabled-data-momentum="2"
      data-debug="true"
    >
  </div>
</body>
</html>
