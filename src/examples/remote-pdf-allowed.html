<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @@HEAD@@ -->
  <title>PDF-A-go-go: Remote PDF (CORS allowed)</title>
  <script defer="defer" src="pdf-a-go-go.js"></script>
</head>
<body>
  <header>
    <h1><a href="./index.html">PDF-A-go-go</a>: Remote PDF (CORS allowed)</h1>
    <!-- @@NAV@@ -->
  </header>
  <main>
    <p>
      Remote PDF that should load successfully via CORS: <code>https://pdfobject.com/pdf/sample.pdf</code>
    </p>
    <div class="pdfagogo-container" id="pdfagogo-container"
        tabindex="0"
        role="region"
        aria-label="PDF Viewer"
        aria-live="polite"
        aria-atomic="true"
        data-pdf-url="https://pdfobject.com/pdf/sample.pdf"
        data-show-search="true"
        data-show-prev-next="true"
        data-show-page-selector="true"
        data-show-current-page="true"
        data-show-download="true"
        data-debug="true"
        style="width:100%;max-width:1400px;height:700px;box-sizing:border-box;margin:1rem auto;border:1px solid #ddd;border-radius:4px;background:#fff;">
    </div>
  </main>
</body>
</html>
