<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-A-go-go - Remote PDF (CORS allowed)</title>
  <link rel="stylesheet" href="pdf-a-go-go.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <style>
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif;
    }
  </style>
  <script defer="defer" src="pdf-a-go-go.js"></script>
  <!--
    This page demonstrates loading a remote PDF with permissive CORS headers.
  -->
  </head>
<body>
  <div style="max-width:1200px;margin:1rem auto;text-align:center;background:#e3e3e3;padding:1rem;border-radius:6px;">
    <h1 style="margin:0;"><a href="./" style="text-decoration:none;color:inherit;">PDF-A-go-go</a></h1>
    <div>A lightweight embeddable PDF viewer. View the project or contribute on
      <a href="https://github.com/khawkins98/PDF-A-go-go" target="_blank" rel="noopener noreferrer">GitHub</a>.
    </div>
  </div>

  <p style="text-align:center;margin:0 1rem;">
    Remote PDF that should load successfully via CORS: <code>https://pdfobject.com/pdf/sample.pdf</code>
  </p>

  <div class="pdfagogo-container" id="pdfagogo-container"
       tabindex="0"
       role="region"
       aria-label="PDF Viewer"
       aria-live="polite"
       aria-atomic="true"
       data-pdf-url="https://pdfobject.com/pdf/sample.pdf"
       data-show-search="true"
       data-show-prev-next="true"
       data-show-page-selector="true"
       data-show-current-page="true"
       data-show-download="true"
       data-debug="true"
       style="width:100%;max-width:1400px;height:700px;box-sizing:border-box;margin:1rem auto;border:1px solid #ddd;border-radius:4px;background:#fff;">
  </div>
</body>
</html>
