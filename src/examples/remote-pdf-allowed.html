<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @@HEAD@@ -->
  <title>Remote CORS - PDF-A-go-go</title>
</head>
<body>
  <header>
    <!-- @@NAV@@ -->
  </header>
  <main>
    <h1>Remote CORS</h1>
    <p>A remote PDF loaded via CORS from <code>pdfobject.com</code>. Demonstrates loading PDFs from external servers with proper CORS headers.</p>
    <div class="feature-list">
      <span class="badge">Remote URL</span>
      <span class="badge">CORS Enabled</span>
      <span class="badge">Cross-Origin</span>
    </div>
    <script defer="defer" src="pdf-a-go-go.js"></script>
    <div class="pdfagogo-container" id="pdfagogo-container"
        tabindex="0"
        role="region"
        aria-label="PDF Viewer"
        aria-live="polite"
        aria-atomic="true"
        data-pdf-url="https://pdfobject.com/pdf/sample.pdf"
        data-show-search="true"

        data-show-page-selector="true"
        data-show-current-page="true"
        data-show-download="true"
        data-show-fullscreen="true"
        data-debug="true">
    </div>
  </main>
</body>
</html>
