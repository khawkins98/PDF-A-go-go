<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF-A-go-go - Remote PDF (CORS allowed)</title>
  <link rel="stylesheet" href="pdf-a-go-go.css">

  <!-- Simple.css is only used for the demo pages, not a required dependency -->
  <link rel="stylesheet" href="https://cdn.simplecss.org/simple.css">
  <script defer="defer" src="pdf-a-go-go.js"></script>
</head>
<body>
  <header>
    <h1>PDF-A-go-go</h1>
    <nav>
      <a href="./">Basic Demo</a>
      <a href="./double-spread.html">Large Double Spread (12MB PDF)</a>
      <a href="./html-download-example.html">HTML Download Handler</a>
      <a href="./stress-test-large-pdf.html">Stress Test (827 pages)</a>
      <a href="./remote-pdf-allowed.html">Remote PDF (CORS allowed)</a>
      <a href="./remote-pdf-cors-fail.html">Remote PDF (expected CORS failure)</a>
    </nav>
    <p>
      Remote PDF that should load successfully via CORS: <code>https://pdfobject.com/pdf/sample.pdf</code>
    </p>
  </header>
  <div class="pdfagogo-container" id="pdfagogo-container"
       tabindex="0"
       role="region"
       aria-label="PDF Viewer"
       aria-live="polite"
       aria-atomic="true"
       data-pdf-url="https://pdfobject.com/pdf/sample.pdf"
       data-show-search="true"
       data-show-prev-next="true"
       data-show-page-selector="true"
       data-show-current-page="true"
       data-show-download="true"
       data-debug="true"
       style="width:100%;max-width:1400px;height:700px;box-sizing:border-box;margin:1rem auto;border:1px solid #ddd;border-radius:4px;background:#fff;">
  </div>
</body>
</html>
