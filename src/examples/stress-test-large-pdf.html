<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @@HEAD@@ -->
  <title>Many Pages (827) - PDF-A-go-go</title>
</head>
<body>
  <header>
    <!-- @@NAV@@ -->
  </header>
  <main>
    <h1>Many Pages (827)</h1>
    <p>An 827-page document. Useful for seeing how the viewer handles scrolling and memory with a big page count.</p>
    <div class="feature-list">
      <span class="badge">827 Pages</span>
      <span class="badge">Virtual Scroll</span>
      <span class="badge">Memory Efficient</span>
    </div>
    <script defer="defer" src="pdf-a-go-go.js"></script>
    <div class="pdfagogo-container" id="pdfagogo-container"
          data-pdf-url="./example_large.pdf"
          data-show-search="true"
          data-show-page-selector="true"
          data-show-current-page="true"
          data-show-download="true"
          data-show-fullscreen="true"
          data-show-resize-grip="true"
          data-debug="true"
          data-default-page="1">
    </div>
  </main>
</body>
</html>
