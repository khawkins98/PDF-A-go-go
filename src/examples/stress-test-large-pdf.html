<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF-A-go-go - Large PDF Stress Test (827 pages)</title>
    <link rel="stylesheet" href="pdf-a-go-go.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
  <style>
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif;
    }
  </style>
</head>
<body>
  <div style="max-width:1200px;margin:1rem auto;text-align:center;background:#e3e3e3;padding:1rem;border-radius:6px;">
    <strong>PDF-A-go-go:</strong> A lightweight embeddable PDF viewer. View the project or contribute on <a href="https://github.com/khawkins98/PDF-A-go-go" target="_blank" rel="noopener noreferrer">GitHub</a>.
  </div>
    <p style="text-align: center;">This is a large PDF example (827 pages) for stress testing.</p>
    <!-- PDF Viewer Container with Large PDF and Debug Mode -->
    <div class="pdfagogo-container" id="pdfagogo-container"
         data-pdf-url="./example_large.pdf"
         data-show-search="true"
         data-show-page-selector="true"
         data-show-current-page="true"
         data-show-download="true"
         data-show-resize-grip="true"
         data-debug="true"
         data-default-page="1"
         style="width:100%;max-width:1400px;height:500px;box-sizing:border-box;margin:0 auto;">
    </div>
    <script src="pdf-a-go-go.js"></script>
</body>
</html>
