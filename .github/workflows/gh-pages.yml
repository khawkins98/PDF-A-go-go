name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          # setup-node@v5 enables package-manager caching by default, which
          # requires a committed yarn.lock. This repo intentionally gitignores
          # yarn.lock, so disable the cache (matches the v4 behavior).
          package-manager-cache: false

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build and test
        run: yarn test

      - name: Check bundle size
        run: yarn size

      - name: Deploy to GitHub Pages
        # Only deploy from pushes to main; pull requests run build + test only.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
