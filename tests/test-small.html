<style>
  :root {
    --sidebar-width: 240px;
    --sidebar-bg: #f8fafc;
    --sidebar-border: #e2e8f0;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --accent-light: #eef2ff;
    --border-radius: 6px;
    --bg-main: #ffffff;
    --code-bg: #f1f5f9;
    --font-mono: 'SF Mono', Monaco, 'Cascadia Code', Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-primary);
    background: var(--bg-main);
  }

  header {
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--sidebar-border);
    padding: 1rem 1.25rem;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary);
    text-decoration: none;
    margin-bottom: 1rem;
  }

  .logo svg {
    width: 24px;
    height: 24px;
    color: var(--accent);
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
  }

  h2.nav-section {
    width: 100%;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin: 0.75rem 0 0.25rem;
  }

  h2.nav-section:first-of-type { margin-top: 0; }

  nav a {
    display: inline-block;
    padding: 0.4rem 0.75rem;
    border-radius: var(--border-radius);
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }

  nav a:hover,
  nav a.active {
    background: var(--accent-light);
    color: var(--accent);
  }

  main {
    padding: 1.5rem;
    max-width: 900px;
  }

  main h1 {
    font-size: 1.75rem;
    font-weight: 700;
    margin: 0 0 0.5rem;
    line-height: 1.3;
  }

  main > p:first-of-type {
    font-size: 1rem;
    color: var(--text-secondary);
    margin: 0 0 1.5rem;
  }

  code {
    font-family: var(--font-mono);
    font-size: 0.85em;
    background: var(--code-bg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
    color: var(--accent);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.25rem 0.6rem;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 500;
    border-radius: 99px;
    margin: 0 0.5rem 0.5rem 0;
  }

  .feature-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  @media (min-width: 768px) {
    body {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      min-height: 100vh;
    }
    header {
      border-bottom: none;
      border-right: 1px solid var(--sidebar-border);
      padding: 1.5rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .logo { margin-bottom: 1.5rem; }
    nav {
      flex-direction: column;
      flex-wrap: nowrap;
      gap: 0.125rem;
    }
    nav a {
      display: block;
      padding: 0.45rem 0.75rem;
    }
    main { padding: 2.5rem 3rem; }
    main h1 { font-size: 2rem; }
  }

  .pdfagogo-container {
    border-radius: var(--border-radius);
    overflow: hidden;
  }

  /* Code example block */
  .code-example {
    margin-top: 1.5rem;
    border: 1px solid var(--sidebar-border);
    border-radius: var(--border-radius);
    overflow: hidden;
  }

  .code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 1rem;
    background: #2d2d2d;
    color: #999;
    font-size: 0.75rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .code-copy {
    padding: 0.35rem 0.75rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .code-copy:hover { background: var(--accent-hover); }

  .code-example pre {
    margin: 0;
    padding: 1rem;
    background: #1e1e1e;
    overflow-x: auto;
  }

  .code-example code {
    background: none;
    padding: 0;
    color: #d4d4d4;
    font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
    font-size: 0.85rem;
    line-height: 1.5;
  }

  .theme-toggle.active {
    background: var(--accent-light);
    color: var(--accent);
  }
</style>
<script>
  function toggleTheme() {
    var container = document.querySelector('.pdfagogo-container');
    if (!container) return;
    var btn = document.querySelector('.theme-toggle');
    var isDark = container.getAttribute('data-theme') === 'dark';
    if (isDark) {
      container.removeAttribute('data-theme');
      if (btn) { btn.classList.remove('active'); btn.textContent = '\u263D Dark mode'; }
    } else {
      container.setAttribute('data-theme', 'dark');
      if (btn) { btn.classList.add('active'); btn.textContent = '\u263C Light mode'; }
    }
  }
</script>
