<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./pdf-a-go-go.css">
<!-- Simple.css is only used for the demo pages, not a required dependency -->
<link rel="stylesheet" href="https://cdn.simplecss.org/simple.css">



  <title>PDF-A-go-go: a simple, embeddable PDF viewer project</title>
</head>
<body>
  <header>
    <h1><a href="./index.html">PDF-A-go-go</a></h1>
    <nav>
  <a href="./">Overview</a>
  <a href="./double-spread.html">12MB PDF</a>
  <a href="./stress-test-large-pdf.html">827 page PDF</a>
  <a href="./html-download-example.html">HTML proxy</a>
  <a href="./remote-pdf-allowed.html">Remote file</a>
  <a href="./remote-pdf-cors-fail.html">Expected CORS failure</a>
  <a href="https://github.com/khawkins98/PDF-A-go-go" target="_blank" rel="noopener">GitHub Repo</a>
</nav>

  </header>
  <main>
    <p>A lightweight embeddable PDF viewer. <a href="https://github.com/khawkins98/PDF-A-go-go" target="_blank" rel="noopener noreferrer">See the docs on GitHub</a>.
    </p>
    <script defer="defer" src="pdf-a-go-go.js"></script>
    <div class="pdfagogo-container" id="pdfagogo-container"
         tabindex="0"
         role="region"
         aria-label="PDF Viewer"
         aria-live="polite"
         aria-atomic="true"
         data-pdf-url="./example.pdf"
         data-show-search="true"
         data-show-prev-next="true"
         data-show-page-selector="true"
         data-show-current-page="true"
         data-default-page="3"
         data-show-download="true"
         data-show-share="true"
         data-show-accessibility-controls-visibly="false"
         disabled-data-momentum="2"
         data-debug="false"
        >
      </div>
  </main>
</body>
</html>
